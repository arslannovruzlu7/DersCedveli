<!DOCTYPE html>
<html lang="az"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dərs cədvəli</title>
<style>
:root{--bg:#f3f5f1;--sf:#fff;--tx:#1d2b24;--mu:#66756c;--ac:#1f6f50;--ac2:#e4f0ea;--bd:#d5ddd7;--er:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--sf:#1d2521;--tx:#e6ede8;--mu:#93a39a;--ac:#5fc79a;--ac2:#25382f;--bd:#33423a;--er:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:16px}
h1{font:700 26px/1.2 Georgia,serif;margin:6px 0 12px}h2{font:600 18px Georgia,serif;margin:0 0 4px}
nav{display:flex;gap:6px;margin-bottom:12px}nav button{flex:1;padding:10px 4px}
button,.btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on,.p{background:var(--ac);color:#fff;border-color:var(--ac)}
section{display:none;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px}section.on{display:block}
.hint{color:var(--mu);margin:0 0 12px;font-size:14px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input:not([type=checkbox]),select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}.row>div{display:flex;flex-direction:column;justify-content:flex-end}.row label{line-height:1.25}
.box{border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:14px;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{margin:0;color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:5px 12px;background:var(--sf);cursor:pointer;font-size:14px;display:flex;gap:6px;align-items:center}
.chips label:has(input:checked){background:var(--ac2);border-color:var(--ac)}
.sr{display:grid;grid-template-columns:1fr 90px 40px;gap:8px;margin-bottom:6px;align-items:stretch}.sr button{padding:0}
.item{border:1px solid var(--bd);border-radius:8px;padding:10px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.item small{color:var(--mu);display:block}.acts{display:flex;gap:6px;flex-shrink:0}.d{color:var(--er)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.bar select{width:auto;min-width:200px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:620px}
th,td{border:1px solid var(--bd);padding:6px;text-align:center;height:54px}th{background:var(--ac2)}
td b{display:block;font-size:13px}td span{font-size:12px;color:var(--mu)}
#hb{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;padding:0;font-size:22px;font-weight:700;background:var(--ac);color:#fff;border:0;box-shadow:0 2px 10px rgba(0,0,0,.3);z-index:40}
#tv{display:none}#tv.on{display:block}.tvp{position:fixed;background:rgba(0,0,0,.3);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:50}
#tvh{position:fixed;border:2px solid var(--ac);border-radius:8px;z-index:51;pointer-events:none}
#tvt{position:fixed;z-index:52;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:14px}
#tvt .tb{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}#tvt button{padding:5px 10px;font-size:13px}#tvn{color:var(--mu);font-size:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:9;max-width:90%}.guide{margin-top:16px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px 16px}.guide summary{cursor:pointer;font-weight:600}.guide h4{margin:14px 0 4px;color:var(--ac)}.guide p,.guide ul{margin:0 0 6px;font-size:14px}.guide ul{padding-left:20px}
#pa{display:none}.msg{margin:10px 0;padding:10px;border-radius:8px;background:var(--ac2)}.msg.e{color:var(--er);border:1px solid var(--er);background:none}
@media print{nav,.bar,h1,.hint,#g1,details,#hb,#tv{display:none}section{display:none;border:0}#s3{display:block}body.pall #s3{display:none}body.pall #pa{display:block}.pg{page-break-after:always}table{min-width:0}}
</style></head><body><main>
<h1>Dərs cədvəli</h1>
<nav id="nav"></nav>

<section id="s0"><h2>1. Dərs zəngləri</h2><p class="hint">Dəyərləri yazın, zənglər avtomatik qurulur.</p>
<div class="row"><div><label>Dərs sayı (gündə)</label><input id="bn" type="number" min="1" max="12" value="7"></div>
<div><label>Birinci dərs başlayır</label><input id="bs" type="time" value="08:00"></div>
<div><label>Dərs müddəti (dəq)</label><input id="bl" type="number" value="45"></div>
<div><label>Tənəffüs (dəq)</label><input id="bb" type="number" value="10"></div>
<div><label>Böyük tənəffüs neçənci dərsdən sonra</label><input id="ba" type="number" value="3"></div>
<div><label>Böyük tənəffüs (dəq)</label><input id="bg" type="number" value="15"></div></div>
<div id="bp" class="chips" style="margin-top:12px"></div><div class="bar"><button class="p" onclick="tab(1)">Növbəti: Siniflər →</button></div></section>

<section id="s1"><h2>2. Siniflər</h2><p class="hint">Sinif adını və hər fənn üçün həftəlik saatı əlavə edin.</p>
<div class="box" id="cf"></div><div id="cl"></div><div class="bar"><button onclick="tab(0)">← Geri</button><button class="p" onclick="tab(2)">Növbəti: Müəllimlər →</button></div></section>

<section id="s2"><h2>3. Müəllimlər</h2><p class="hint">Əvvəlcə siniflər bölməsini doldurun, sonra müəllim əlavə edin.</p>
<div class="box" id="tf"></div><div id="tl"></div><div class="bar"><button onclick="tab(1)">← Geri</button><button class="p" onclick="tab(3)">Növbəti: Cədvəl →</button></div></section>

<section id="s3"><h2>4. Cədvəl</h2>
<div class="chips" id="gpw" style="margin:8px 0"><label><input type="checkbox" id="gp" onchange="S.gap=this.checked;save()">Boş saat ola bilər</label></div>
<div class="bar" id="g1"><button class="p" id="gb" onclick="gen()">Cədvəli yarat</button><button onclick="twice(this,wipe)">Hamısını təmizlə</button></div>
<div id="out"></div>
<div class="bar"><select id="view" onchange="render()"></select><button class="p" id="xb" style="display:none" onclick="exportX()">Excel faylı kimi yüklə</button><button onclick="print()">Bu cədvəli çap et</button><button onclick="printAll()">Hamısını çap et</button></div>
<div class="wrap" id="grid"></div></section>
<button id="hb" onclick="tourStart()" title="Kömək">?</button>
<div id="tv"><div class="tvp"></div><div class="tvp"></div><div class="tvp"></div><div class="tvp"></div><div id="tvh"></div><div id="tvt"><div id="tvm"></div><div class="tb"><span id="tvn"></span><span><button id="tvp" onclick="tourGo(-1)">Geri</button> <button class="p" id="tvx" onclick="tourGo(1)">Növbəti</button> <button onclick="tourEnd()">✕</button></span></div></div></div>
<datalist id="dl"></datalist><div id="pa"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const D=["I","II","III","IV","V"],TABS=["Zənglər","Siniflər","Müəllimlər","Cədvəl"];
let S={bells:[],classes:[],teachers:[]},placed=[],rows=[{s:"",h:""}],eC=-1,eT=-1,eA=null;
const $=i=>document.getElementById(i),m=t=>{const[h,n]=t.split(":");return+h*60+ +n},hm=x=>String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),norm=s=>s.trim().toLowerCase();
const save=()=>{placed=[];$("out").innerHTML="";try{localStorage.setItem("cedvel2",JSON.stringify(S))}catch(e){}};
function tab(i){TABS.forEach((_,k)=>{$("s"+k).classList.toggle("on",k==i);$("nav").children[k].classList.toggle("on",k==i)});if(i==2)tForm(1);if(i==3)render()}
function init(){try{const v=localStorage.getItem("cedvel2");if(v)S=JSON.parse(v)}catch(e){}
S.teachers.forEach(t=>{if(!t.as)t.as=t.a?[{s:"",c:t.c||[]}]:(t.s||"").split(",").map(x=>x.trim()).filter(Boolean).map(x=>({s:x,c:t.c||[]}))});
$("nav").innerHTML=TABS.map((t,i)=>`<button onclick="tab(${i})">${t}</button>`).join("");
["bn","bs","bl","bb","ba","bg"].forEach(i=>$(i).oninput=bells);
if(S.bells.length)showBells();else bells();cForm();list();$("gp").checked=!!S.gap;tab(0)}
function bells(){const n=+$("bn").value||1,l=+$("bl").value||45,b=+$("bb").value||0,a=+$("ba").value,g=+$("bg").value||b;let t=m($("bs").value||"08:00");S.bells=[];
for(let i=1;i<=n;i++){S.bells.push(hm(t)+"-"+hm(t+l));t+=l+(i==a?g:b)}save();showBells()}
function showBells(){$("bp").innerHTML=S.bells.map((b,i)=>`<label style="cursor:default">${i+1}. ${b}</label>`).join("")}
// siniflər
const dm=c=>{const n=S.bells.length;if(c&&c.dm)return c.dm.map(x=>Math.min(x,n));const v=c&&c.mx?Math.min(c.mx,n):n;return[v,v,v,v,v]};
function cForm(keep){const c=eC>=0?S.classes[eC]:null;const o=keep&&$("cn")?{n:$("cn").value,d:D.map((_,i)=>$("cm"+i).value)}:null;if(!keep&&c&&rows.length==1&&!rows[0].s)rows=c.plan.map(p=>({s:p.s,h:p.h}));
$("cf").innerHTML=`<div class="row"><div><label>Sinif adı</label><input id="cn" placeholder="5A" value="${esc(o?o.n:c?c.n:"")}"></div></div><label>Hər gün ən çox neçə dərs olsun (0 = həmin gün dərs yoxdur)</label><div class="row" style="grid-template-columns:repeat(5,1fr)">${D.map((d,i)=>`<div><label>${d} gün</label><input id="cm${i}" type="number" min="0" max="${S.bells.length}" value="${o?o.d[i]:dm(c)[i]}"></div>`).join("")}</div><label>Fənlər</label>`+
rows.map((r,i)=>`<div class="sr"><input list="dl" placeholder="Fənn" value="${esc(r.s)}" oninput="rows[${i}].s=this.value"><input type="number" min="1" placeholder="Saat" value="${r.h}" oninput="rows[${i}].h=this.value"><button class="d" onclick="rows.splice(${i},1);if(!rows.length)rows=[{s:'',h:''}];cForm(1)">×</button></div>`).join("")+
`<div class="bar"><button onclick="rows.push({s:'',h:''});cForm(1)">+ Fənn əlavə et</button><button class="p" onclick="saveClass()">${c?"Dəyişikliyi saxla":"Sinfi əlavə et"}</button>${c?'<button onclick="eC=-1;rows=[{s:\'\',h:\'\'}];cForm()">Ləğv et</button>':""}</div>`}
function saveClass(){const n=$("cn").value.trim(),plan=rows.filter(r=>r.s.trim()&&+r.h>0).map(r=>({s:r.s.trim(),h:+r.h}));
if(!n||!plan.length)return alert("Sinif adı və ən azı bir fənn (saatla) yazın.");const dmv=D.map((_,i)=>+$("cm"+i).value||0);if(dmv.some(x=>x<0||x>S.bells.length)||!dmv.some(x=>x>0))return alert("Gündəlik dərs sayı 0 ilə "+S.bells.length+" arasında olmalıdır.");
if(S.classes.some((c,i)=>i!=eC&&norm(c.n)==norm(n)))return alert("Bu sinif artıq var.");
if(eC>=0){const old=S.classes[eC].n;S.teachers.forEach(t=>t.as.forEach(b=>b.c=b.c.map(x=>x==old?n:x)));S.classes[eC]={n,plan,dm:dmv}}else S.classes.push({n,plan,dm:dmv});
eC=-1;rows=[{s:"",h:""}];save();cForm();list()}
function editC(i){eC=i;rows=[{s:"",h:""}];cForm();scrollTo(0,0)}
// müəllimlər
function tForm(keep){const o=keep&&$("tn")?{n:$("tn").value,f:$("tfr").value,t:$("tto").value,d:[...document.querySelectorAll("#td input:checked")].map(Number),a:$("ta").checked}:null;
const base=eT>=0?S.teachers[eT]:{n:"",a:false,as:[{s:"",c:[]}],d:[0,1,2,3,4],f:"08:00",t:"14:00"},t=o||base;
if(!keep||!eA)eA=JSON.parse(JSON.stringify(base.as.length?base.as:[{s:"",c:[]}]));
if(!S.classes.length){$("tf").innerHTML='<div class="msg e">Əvvəlcə siniflər bölməsində sinif əlavə edin.</div>';return}
const bl=t.a?[eA[0]]:eA;
$("tf").innerHTML=`<div class="row"><div><label>Ad Soyad</label><input id="tn" value="${esc(t.n)}"></div>
<div><label>Neçədən</label><input id="tfr" type="time" value="${t.f}"></div><div><label>Neçəyə qədər</label><input id="tto" type="time" value="${t.t}"></div></div>
<div class="chips" style="margin-top:10px"><label><input type="checkbox" id="ta" ${t.a?"checked":""} onchange="tForm(1)">Bütün fənləri keçir (ibtidai sinif müəllimi)</label></div>
<label>${t.a?"Hansı siniflərdə dərs deyir":"Hansı fənni hansı siniflərdə deyir"}</label>
${bl.map((b,i)=>`<div class="box">${t.a?"":`<label>Fənn</label><input list="dl" placeholder="Riyaziyyat" value="${esc(b.s)}" oninput="eA[${i}].s=this.value">`}<label>Siniflər</label><div class="chips">${S.classes.map((c,k)=>`<label><input type="checkbox" ${b.c.includes(c.n)?"checked":""} onchange="tcl(${i},${k},this.checked)">${esc(c.n)}</label>`).join("")}</div>${bl.length>1?`<div class="bar"><button class="d" onclick="eA.splice(${i},1);tForm(1)">× Bu bloku sil</button></div>`:""}</div>`).join("")}
<label>Hansı günlər gələ bilir</label><div class="chips" id="td">${D.map((d,i)=>`<label><input type="checkbox" value="${i}" ${t.d.includes(i)?"checked":""}>${d} gün</label>`).join("")}</div>
<div class="bar">${t.a?"":`<button onclick="eA.push({s:'',c:[]});tForm(1)">+ Başqa fənn / siniflər əlavə et</button>`}<button class="p" onclick="saveT()">${eT>=0?"Dəyişikliyi saxla":"Müəllimi əlavə et"}</button>${eT>=0?'<button onclick="eT=-1;tForm()">Ləğv et</button>':""}</div>`}
function tcl(i,k,v){const n=S.classes[k].n;if(v){if(!eA[i].c.includes(n))eA[i].c.push(n)}else eA[i].c=eA[i].c.filter(x=>x!=n)}
const clsOf=t=>[...new Set(t.as.flatMap(x=>x.c))],subjOf=t=>t.a?"bütün fənlər":[...new Set(t.as.map(x=>x.s))].join(", "),
asText=t=>t.a?"Bütün fənlər: "+esc(clsOf(t).join(", ")):t.as.map(x=>esc(x.s)+" → "+esc(x.c.join(", "))).join("; "),
can=(t,s,c)=>t.a?t.as.some(x=>x.c.includes(c)):t.as.some(x=>norm(x.s)==norm(s)&&x.c.includes(c));
function saveT(){const n=$("tn").value.trim(),a=$("ta").checked,d=[...document.querySelectorAll("#td input:checked")].map(x=>+x.value),
bl=(a?[eA[0]]:eA).map(b=>({s:a?"":b.s.trim(),c:b.c.filter(x=>S.classes.some(y=>y.n==x))})).filter(b=>b.c.length&&(a||b.s));
if(!n||!bl.length||!d.length)return alert("Ad, ən azı bir fənn ilə sinif (və ya “bütün fənləri keçir” ilə sinif) və bir gün seçin.");
if(!$("tfr").value||!$("tto").value||m($("tfr").value)>=m($("tto").value))return alert("Saat aralığı düz deyil.");
const o={n,a,as:bl,d,f:$("tfr").value,t:$("tto").value};eT>=0?S.teachers[eT]=o:S.teachers.push(o);eT=-1;save();tForm();list()}
function editT(i){eT=i;tForm();scrollTo(0,0)}
function del(k,i){S[k].splice(i,1);if(k=="classes"){eC=-1;rows=[{s:"",h:""}];cForm()}else{eT=-1;tForm()}save();list()}
function list(){$("cl").innerHTML=S.classes.map((c,i)=>`<div class="item"><div><b>${esc(c.n)}</b><small>${c.plan.map(p=>esc(p.s)+" "+p.h).join(", ")} (cəmi ${c.plan.reduce((a,p)=>a+p.h,0)} saat, günlər üzrə ${dm(c).join("/")} dərs)</small></div><div class="acts"><button onclick="editC(${i})">Dəyiş</button><button class="d" onclick="twice(this,()=>del('classes',${i}))">Sil</button></div></div>`).join("");
$("tl").innerHTML=S.teachers.map((t,i)=>`<div class="item"><div><b>${esc(t.n)}</b><small>${asText(t)} | ${t.d.map(x=>D[x]).join(", ")} | ${t.f}–${t.t}</small></div><div class="acts"><button onclick="editT(${i})">Dəyiş</button><button class="d" onclick="twice(this,()=>del('teachers',${i}))">Sil</button></div></div>`).join("");
$("dl").innerHTML=[...new Set(S.classes.flatMap(c=>c.plan.map(p=>p.s)).concat(S.teachers.flatMap(t=>t.as.map(x=>x.s).filter(Boolean))))].map(s=>`<option value="${esc(s)}">`).join("")}
function sample(){const pl=h=>[["Riyaziyyat",h],["Azərbaycan dili",4],["Tarix",2],["İngilis dili",3],["Fiziki tərbiyə",2]].map(([s,h])=>({s,h}));
S.classes=[{n:"5A",plan:pl(4),mx:5},{n:"5B",plan:pl(4),mx:5},{n:"6A",plan:pl(5),mx:6}];const A=["5A","5B","6A"],T=(n,s,d,f,t)=>({n,s,c:A,d,f,t});
S.teachers=[T("Aygün Məmmədova","Riyaziyyat",[0,1,2,3,4],"08:00","14:30"),T("Leyla Həsənova","Azərbaycan dili",[0,1,2,3],"08:00","13:30"),T("Rəşad Əliyev","Tarix",[0,2,4],"08:00","13:30"),T("Nigar Quliyeva","İngilis dili",[1,2,3,4],"09:00","14:30"),T("Elçin Bağırov","Fiziki tərbiyə",[0,1,3],"08:00","13:30")];
save();list();gen()}
// həlledici
function solve(){const P=S.bells.map(b=>b.split("-").map(m)),NP=P.length,ND=5;
const av=S.teachers.map(t=>{const f=m(t.f),e=m(t.t);return Array.from({length:ND},(_,d)=>P.map(p=>t.d.includes(d)&&p[0]>=f&&p[1]<=e))});
const MX={};S.classes.forEach(c=>MX[c.n]=dm(c));const cnt=av.map(a=>a.flat().filter(Boolean).length),ld=S.teachers.map(()=>0),L=[];
for(const c of S.classes){const tot=c.plan.reduce((a,p)=>a+p.h,0),mx=MX[c.n].reduce((a,b)=>a+b,0);if(tot>mx)throw`${c.n} sinfinin ${tot} saatı həftəlik ${mx} yuvaya sığmır.`;
for(const p of c.plan){const cd=S.teachers.map((t,i)=>i).filter(i=>can(S.teachers[i],p.s,c.n));
if(!cd.length)throw`${c.n} sinfinin "${p.s}" fənni üçün müəllim yoxdur.`;
const ex=i=>S.teachers[i].a?0:1;cd.sort((a,b)=>ex(b)-ex(a)||ld[a]/Math.max(cnt[a],1)-ld[b]/Math.max(cnt[b],1));let t=cd.find(i=>ld[i]+p.h<=cnt[i]);if(t===undefined)t=cd[0];ld[t]+=p.h;
if(ld[t]>cnt[t])throw`${S.teachers[t].n} müəllimin uyğun vaxtı (${cnt[t]} saat) ${ld[t]} dərs üçün kifayət etmir.`;
for(let k=0;k<p.h;k++)L.push({c:c.n,s:p.s,t})}}
const T0=Date.now();for(let r=0;r<60&&Date.now()-T0<9000;r++){const TS=S.teachers.map(()=>Array.from({length:ND},()=>Array(NP).fill(0))),CS={},cd={},res=[];
S.classes.forEach(c=>CS[c.n]=Array.from({length:ND},()=>Array(NP).fill(0)));
const CC={},K={};S.classes.forEach(c=>{const k=Array(ND).fill(0),mx=MX[c.n];let t=c.plan.reduce((a,p)=>a+p.h,0);while(t-->0){let b=-1,bs=1e9;for(let d=0;d<ND;d++)if(k[d]<mx[d]){const s=k[d]+Math.random()*(1.3+r*.15);if(s<bs){bs=s;b=d}}k[b]++}K[c.n]=S.gap?Array(ND).fill(NP):k});
const ord=L.map(l=>({l,k:cnt[l.t]+Math.random()*30})).sort((a,b)=>a.k-b.k).map(x=>x.l);let nodes=0;
const bt=i=>{if(i==ord.length)return true;if(++nodes>40000||(nodes%100==0&&Date.now()-T0>9000))return false;const l=ord[i],o=[];
